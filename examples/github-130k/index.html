<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 인터랙티브 산점도 (regl-scatterplot 한국어 데모)</title>
  <style>
    :root { --bg: #0d1117; --fg: #e6edf3; --accent: #58a6ff; --muted: #8b949e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; }
    .header { position: fixed; top: 0; left: 0; right: 0; padding: 16px 24px; background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #21262d; z-index: 10; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--muted); }
    .stats { display: inline-block; padding: 2px 8px; background: var(--accent); color: #fff; border-radius: 12px; font-size: 12px; font-weight: 600; margin-left: 8px; }
    #plot { position: fixed; top: 70px; left: 0; right: 0; bottom: 0; }
    .legend { position: fixed; bottom: 16px; left: 16px; background: rgba(13, 17, 23, 0.92); padding: 12px 16px; border: 1px solid #21262d; border-radius: 8px; font-size: 12px; max-height: 240px; overflow-y: auto; z-index: 10; }
    .legend h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    .legend-item { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-count { color: var(--muted); font-size: 11px; margin-left: auto; padding-left: 12px; }
    .tooltip { position: fixed; padding: 8px 12px; background: rgba(13, 17, 23, 0.95); border: 1px solid #58a6ff; border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 20; max-width: 320px; display: none; }
    .tooltip-name { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
    .tooltip-row { color: var(--muted); }
    .tooltip-row span { color: var(--fg); }
  </style>
</head>
<body>
  <div class="header">
    <h1>🐙 GitHub 저장소 인터랙티브 산점도 <span id="stats" class="stats">로딩 중...</span></h1>
    <p class="subtitle">X축 = ⭐ Stars · Y축 = 🍴 Forks · 색상 = 언어 · 드래그/줌/라쏘 선택 가능</p>
  </div>
  <div id="plot"></div>
  <div class="legend" id="legend"><h3>언어 Top 10</h3></div>
  <div class="tooltip" id="tooltip"></div>
  <script type="importmap">
    {
      "imports": {
        "pub-sub-es": "https://cdn.jsdelivr.net/npm/pub-sub-es@3.0.0/+esm",
        "regl": "https://cdn.jsdelivr.net/npm/regl@2.1.1/+esm"
      }
    }
  </script>
  <script type="module">
    import createScatterplot from './regl-scatterplot.esm.js';

    const LANG_COLORS = {
      Python: '#3572A5', TypeScript: '#3178c6', JavaScript: '#f1e05a',
      Rust: '#dea584', Go: '#00ADD8', C: '#555555', 'C++': '#f34b7d',
      Java: '#b07219', Shell: '#89e051', HTML: '#e34c26', CSS: '#563d7c',
      Ruby: '#701516', PHP: '#4F5D95', Swift: '#F05138', Kotlin: '#A97BFF',
      'C#': '#178600', Lua: '#000080', Dart: '#00B4AB', Unknown: '#6e7681',
    };
    const COLOR_DEFAULT = '#6e7681';

    async function main() {
      const resp = await fetch('./data/github-repos.json');
      const payload = await resp.json();
      const repos = payload.repos || [];
      document.getElementById('stats').textContent = `${repos.length.toLocaleString()}개`;

      const container = document.getElementById('plot');
      const hexToRgba = (hex) => {
        const v = parseInt(hex.slice(1), 16);
        return [(v >> 16) & 0xff, (v >> 8) & 0xff, v & 0xff, 255];
      };
      const points = repos.map(r => {
        const colorHex = LANG_COLORS[r.lang] || COLOR_DEFAULT;
        return {
          x: Math.log10(Math.max(r.x, 1)),
          y: Math.log10(Math.max(r.y, 1)),
          color: hexToRgba(colorHex),
          label: r.full_name,
        };
      });

      const scatter = createScatterplot({
        width: container.clientWidth,
        height: container.clientHeight,
        pointSize: 3,
        pointColorHover: [0xff, 0xff, 0xff],
        pointSizeSelected: 5,
        targetFps: 30,
      });

      container.appendChild(scatter.get('canvas'));
      scatter.draw(points);

      window.addEventListener('resize', () => {
        scatter.set({ width: container.clientWidth, height: container.clientHeight });
      });

      const langCounts = {};
      for (const r of repos) {
        const lang = r.lang || 'Unknown';
        langCounts[lang] = (langCounts[lang] || 0) + 1;
      }
      const topLangs = Object.entries(langCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);
      const legendEl = document.getElementById('legend');
      legendEl.innerHTML = '<h3>언어 Top 10</h3>';
      for (const [lang, count] of topLangs) {
        const item = document.createElement('div');
        item.className = 'legend-item';
        const color = LANG_COLORS[lang] || COLOR_DEFAULT;
        item.innerHTML = `<span class="legend-dot" style="background:${color}"></span><span>${lang}</span><span class="legend-count">${count}</span>`;
        legendEl.appendChild(item);
      }

      const tooltip = document.getElementById('tooltip');
      scatter.subscribe('pointover', (pointIndex) => {
        const repo = repos[pointIndex];
        if (!repo) return;
        tooltip.style.display = 'block';
        tooltip.innerHTML = `
          <div class="tooltip-name">${repo.full_name}</div>
          <div class="tooltip-row">⭐ Stars: <span>${repo.x.toLocaleString()}</span></div>
          <div class="tooltip-row">🍴 Forks: <span>${repo.y.toLocaleString()}</span></div>
          <div class="tooltip-row">📦 Lang: <span>${repo.lang || 'Unknown'}</span></div>
          ${repo.description ? `<div class="tooltip-row" style="margin-top:4px">${repo.description.slice(0, 80)}</div>` : ''}
        `;
      });
      scatter.subscribe('pointout', () => { tooltip.style.display = 'none'; });
      container.addEventListener('mousemove', (e) => {
        if (tooltip.style.display === 'block') {
          tooltip.style.left = (e.clientX + 12) + 'px';
          tooltip.style.top = (e.clientY + 12) + 'px';
        }
      });

      scatter.subscribe('select', (selectedIds) => {
        const selected = selectedIds.map(i => repos[i]).filter(Boolean);
        const statsEl = document.getElementById('stats');
        statsEl.textContent = selected.length > 0
          ? `${selected.length}개 선택 (전체 ${repos.length.toLocaleString()})`
          : `${repos.length.toLocaleString()}개`;
      });

      console.log(`[github-130k] ${repos.length}개 로드 완료`);
    }

    main().catch(e => {
      console.error('FATAL:', e);
      document.getElementById('stats').textContent = '로드 실패';
    });
  </script>
</body>
</html>
